<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>お気に入り温泉</title>
    <link rel="stylesheet" th:href="@{/css/favorite.css}"/>
    <!-- Webアプリのロゴ設定 -->
    <link
      rel="icon"
      href="https://res.cloudinary.com/dqtfx88ou/image/upload/v1764137468/icon_fgxqed.png"
    />

    <!-- スマホ用 -->
    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/dqtfx88ou/image/upload/v1764137468/icon_fgxqed.png"
    />
</head>
<body>
<div th:replace="fragments/header :: siteHeader"></div>

<main class="main-container">
    <!-- お気に入りが０件の場合 -->
    <div th:if="${favoriteList.size() == 0}" class="no-favorite">
        まだお気に入り登録がありません。
    </div>

    <!-- カード一覧 -->
    <div th:each="favorite : ${favoriteList}" class="favorite-card">
        <!-- ♥ -->
        <div class="fav-area">
            <form
                    th:action="@{/favorite/remove}"
                    method="post"
                    class="fav-form"
            >
                <input type="hidden" name="favoriteId" th:value="${favorite.id}"/>
                <input type="hidden" name="redirect" th:value="'/favorite/list'"/>
                <button type="submit" class="btn-fav">
                    <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    >
                        <path
                                d="M12 22
                   L10.2 20.2
                   C5 15.2 2 12 2 8.2
                   C2 4.8 4.6 2.8 7.3 2.8
                   C9 2.8 10.8 3.7 12 5.4
                   C13.2 3.7 15 2.8 16.7 2.8
                   C19.4 2.8 22 4.8 22 8.2
                   C22 12 19 15.2 13.8 20.2
                   L12 22Z"
                        />
                    </svg>
                    </svg>
                </button>
            </form>
        </div>

        <div class="fav-right">
            <h3 class="pref" th:text="${favorite.onsen.prefecture}"></h3>
            <h2 class="name" th:text="${favorite.onsen.name}"></h2>
            <p class="description" th:text="${favorite.onsen.description}"></p>
        </div>

        <div class="fav-left">
            <img
                    th:src="@{${favorite.onsen.image1}}"
                    alt="画像1"
                    class="fav-img"
            />
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>

       <!-- ロード中 -->
    <div
      id="loading-screen"
      style="display: none; opacity: 0; visibility: hidden"
    >
      <div class="loading-wrapper">
        <p id="loadingWave" class="loading-wave">Loading...</p>
      </div>
    </div>
<script th:src="@{/js/loader.js}"></script>
</body>
</html>
